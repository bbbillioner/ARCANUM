name: Refresh price snapshot

on:
  # Weekdays at 22:00 UTC (≈6pm ET — after US market close)
  schedule:
    - cron: "0 22 * * 1-5"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest prices from Yahoo Finance
        run: node scripts/fetch-prices.mjs

      - name: Commit refreshed snapshot if changed
        run: |
          if [[ -z "$(git status --porcelain data/prices/)" ]]; then
            echo "No new price data — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices/
          git commit -m "chore(data): refresh price snapshot"
          git push
